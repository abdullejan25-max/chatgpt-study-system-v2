[project]
name = "chatgpt-study-system-v2"
version = "0.6.0"
description = "Local gateway for a ChatGPT-first study system"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mcp>=1,<2", "pypdf>=6.18,<7"]

[project.scripts]
study-migrate = "chatgpt_study_system.migration.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
pdf-ocr = ["PyMuPDF>=1.24,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatgpt_study_system"]

[tool.hatch.build.targets.wheel.force-include]
"src/chatgpt_study_system/workflows/wrong_answer.md" = "chatgpt_study_system/workflows/wrong_answer.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
